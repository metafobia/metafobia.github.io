<!DOCTYPE html>
<!--
  404
  ───
  buscaste una puerta
  y encontraste una pared pintada de puerta.
  así empiezan casi todas las metáforas.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- seguridad: qué puede cargar esta página y hacia dónde puede conectarse -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>esta metáfora no existe · Metafobia</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#e6e6e6;font-family:Georgia,"Times New Roman",serif}
  body{display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden}
  main{text-align:center;max-width:34rem;position:relative;z-index:2}
  .code{font:400 clamp(4rem,16vw,8rem)/1 Georgia,serif;letter-spacing:.08em;color:#fff;
    text-shadow:-3px 0 rgba(255,60,140,.85),3px 0 rgba(80,220,255,.85),0 0 18px rgba(255,255,255,.5);
    animation:split 2.8s steps(1) infinite}
  @keyframes split{
    0%,86%,100%{text-shadow:-3px 0 rgba(255,60,140,.85),3px 0 rgba(80,220,255,.85),0 0 18px rgba(255,255,255,.5);transform:none}
    88%{text-shadow:6px 0 rgba(255,60,140,.9),-6px 0 rgba(80,220,255,.9),0 0 18px rgba(255,255,255,.5);transform:skewX(-6deg) translateX(-3px)}
    92%{text-shadow:-1px 0 rgba(255,60,140,.9),1px 0 rgba(80,220,255,.9),0 0 18px rgba(255,255,255,.5);transform:skewX(3deg) translateX(2px)}
  }
  h1{margin-top:1.2rem;font-weight:400;font-style:italic;font-size:clamp(1.2rem,3.6vw,1.7rem);letter-spacing:.04em;
    text-shadow:0 0 10px rgba(255,255,255,.45)}
  p{margin-top:1rem;color:#8a8a8a;font-size:.98rem;line-height:1.7}
  a.back{display:inline-block;margin-top:2.2rem;color:#e6e6e6;text-decoration:none;font:.85rem "Courier New",Courier,monospace;
    letter-spacing:.08em;border:1px solid #333;border-radius:4px;padding:.6rem 1rem;transition:color .3s,border-color .3s,box-shadow .3s}
  a.back span{color:#50dcff;margin-right:.4em}
  a.back:hover,a.back:focus-visible{color:#fff;border-color:#666;box-shadow:0 0 16px rgba(255,255,255,.18);outline:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  svg{position:fixed;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:3;filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
  @media (prefers-reduced-motion:reduce){.code{animation:none}}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>esta metáfora no existe… todavía</h1>
  <p>Buscaste una puerta y encontraste una pared pintada de puerta.<br>
     El gato también se perdió: lleva un rato olfateando el vacío.</p>
  <a class="back" href="/"><span aria-hidden="true">←</span> volver a Metafobia</a>
</main>

<!-- el gato perdido -->
<svg id="lost" aria-hidden="true" focusable="false">
  <g id="pos">
    <text id="q" x="10" y="-30" fill="#fff" font-family="Courier New, monospace" font-size="9">?</text>
    <path id="tail" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <g stroke="#fff" stroke-width="2.2" stroke-linecap="round"><line/><line opacity=".75"/><line opacity=".75"/><line/></g>
    <ellipse cx="0" cy="-10" rx="11" ry="5.5" fill="#fff"/>
    <g id="head">
      <path d="M7.4 -16.5 L8.6 -24 L11.6 -19.6 Z M12.6 -19.6 L15.8 -24 L16.8 -16.5 Z" fill="#fff"/>
      <circle cx="12" cy="-15" r="5.2" fill="#fff"/>
      <ellipse cx="14.4" cy="-15.8" rx="0.9" ry="1.5" fill="#000"/>
    </g>
  </g>
</svg>

<script src="/404.js"></script>
</body>
</html>
