<!DOCTYPE html>
<!-- .gato — los archivos que empiezan con punto son los que no quieren que los veas. y aquí estás. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>.gato · Metafobia</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#000;color:#e6e6e6}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:2rem 1rem;min-height:100vh;text-align:center}
  img{width:min(46vw,220px);image-rendering:pixelated;filter:drop-shadow(0 0 12px rgba(255,255,255,.45))}
  pre{font:clamp(.8rem,2.6vw,1rem)/1.45 "Courier New",Courier,monospace;color:#e6e6e6;text-align:left;white-space:pre;text-shadow:0 0 8px rgba(255,255,255,.35)}
  pre .z{color:#8fd8ff;animation:z 2.4s ease-in-out infinite}
  @keyframes z{50%{opacity:.25}}
  p{font:italic 1rem/1.7 Georgia,serif;color:#9a9a9a;max-width:26rem}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
  a{color:#e6e6e6;text-decoration:none;font:.82rem "Courier New",monospace;letter-spacing:.06em;border:1px solid #333;border-radius:4px;padding:.55rem .9rem;transition:border-color .3s,color .3s}
  a:hover,a:focus-visible{border-color:#ff8cc6;color:#ff8cc6;outline:none}
  @media (prefers-reduced-motion:reduce){pre .z{animation:none}}
</style>
</head>
<body>
  <img src="/apple-touch-icon.png" alt="Gatito blanco de píxeles sobre fondo negro">
  <pre aria-hidden="true">   /\_/\
  ( -.- )   <span class="z">zzz</span>
   > ^ <
  /     \
 (  | |  )~~
  ^^   ^^</pre>
  <p>este archivo no hace nada. como los gatos.<br>
     si lo encontraste, vuelve a la página y escribe g-a-t-o:<br>te devolverá la visita.</p>
  <div class="row">
    <a href="/">← volver a Metafobia</a>
    <a href="/apple-touch-icon.png" download="gato-metafobia.png">↓ descargar el gato</a>
  </div>
</body>
</html>
