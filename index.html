<!DOCTYPE html>
<!--
  metafobia
  ─────────
  si estás leyendo esto,
  ya cruzaste la piel de la página.
  aquí no hay metáforas:
  solo etiquetas que fingen ser poemas
  y poemas que fingen ser etiquetas.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Metafobia: poesía, código, IA y otros delirios. Obras de net art, poesía visual e ilustración.">
<link rel="canonical" href="https://metafobia.github.io/">
<!-- tarjeta para compartir en redes -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Metafobia">
<meta property="og:title" content="Metafobia">
<meta property="og:description" content="Poesía, código, IA y otros delirios.">
<meta property="og:url" content="https://metafobia.github.io/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Metafobia: un gatito de píxeles junto a una ilustración a lápiz de una mujer bajo una luna.">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Metafobia">
<meta name="twitter:description" content="Poesía, código, IA y otros delirios.">
<meta name="twitter:image" content="https://metafobia.github.io/og.jpg">
<title>Metafobia</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- el cuerpo de la obra empieza aquí. respira. -->
<main class="layout">
  <section class="col col--left">
    <header class="head">
      <h1 class="title">Metafobia</h1>
      <p class="subtitle">Poesía, código, IA y otros delirios.</p>
    </header>

    <nav class="list-wrap" aria-label="Proyectos" id="listWrap">
      <ul class="list" id="projectList"></ul>

      <canvas class="dust" id="dust" aria-hidden="true"></canvas>
      <svg class="cat" id="cat" width="1" height="1" aria-hidden="true" focusable="false">
        <!-- un gato hecho de curvas: no es un gato, es la idea de un gato que camina sobre las palabras -->
        <g id="catPos">
          <ellipse id="catHit" cx="2" cy="-12" rx="20" ry="14" fill="transparent"/>
          <g id="catBody">
            <path id="tail" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
            <g id="legs" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
              <line/><line opacity=".75"/><line opacity=".75"/><line/>
            </g>
            <ellipse cx="0" cy="-10" rx="11" ry="5.5" fill="#fff"/>
            <g id="catHead">
              <path d="M7.4 -16.5 L8.6 -24 L11.6 -19.6 Z M12.6 -19.6 L15.8 -24 L16.8 -16.5 Z" fill="#fff"/>
              <circle cx="12" cy="-15" r="5.2" fill="#fff"/>
              <ellipse id="catEye" cx="14.4" cy="-15.8" rx="0.9" ry="1.5" fill="#000"/>
            </g>
          </g>
          <!-- postura dormida: enroscado, cabeza hacia el gatito dormido -->
          <g id="catCurl" opacity="0">
            <path id="curlTail" d="M-12 -3 Q-19 2 -5 1.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            <g id="curlBody">
              <ellipse cx="0" cy="-6.5" rx="13" ry="6.5" fill="#fff"/>
              <path d="M15.2 -8 L15.6 -15.8 L11.4 -11.6 Z M10 -11.8 L6.6 -15.6 L5.6 -9 Z" fill="#fff"/>
              <circle cx="11" cy="-6.6" r="5.4" fill="#fff"/>
              <path d="M14.6 -6.6 Q13 -5 11.4 -6.6" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round"/>
              <path d="M15 -1.2 L9 -1.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </svg>
    </nav>
  </section>

  <!-- a la derecha, una imagen que se deshace cuando la miras demasiado -->
  <section class="col col--right" aria-hidden="true">
    <img class="art" src="imagen.png" alt="">
  </section>
</main>
<!-- lo que sigue no se ve, pero lo mueve todo. como el insomnio. -->
<script src="script.js"></script>
<!-- fin. o pausa. en esta página nunca se sabe. -->
</body>
</html>
